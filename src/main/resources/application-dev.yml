        options:
          # You can set: claude-sonnet-4-5 / claude-haiku-4-5 / claude-opus-4-5
          model: ${ANTHROPIC_MODEL}
          max-tokens: ${ANTHROPIC_MAX_TOKENS}
          temperature: ${ANTHROPIC_TEMPERATURE}

server:
  port: ${PORT}

spring:
  application:
    name: llm-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: INFO

# --- Service Discovery (Eureka) ---
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

application:
  downstream:
    hmacSecret: ${HMAC_SECRET}

# --- Your own service-level settings (optional but useful) ---
melisa:
  ai:
    claude:
      system: "Faqat o'zbek tilida va faqat LOTIN yozuvida javob ber. Ruscha yoki inglizcha so'z ishlatma. Qisqa va aniq yoz."
      model: "claude-sonnet-4-5"
      max-output-tokens: 1024
      max-input-chars: 12000
      temperature: 0.2
#      top-p: 0.9

# =========================
# DEV profile: local Ollama

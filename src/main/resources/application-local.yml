server:
  port: ${PORT:8090}

spring:
  application:
    name: llm-service

  datasource:
    url: jdbc:postgresql://localhost:5432/llm_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: INFO

application:
  downstream:
    hmacSecret: ${HMAC_SECRET:change-me-downstream-shared-secret}
  catalog:
    catalog-service-url: ${CATALOG_SERVICE_URL:http://localhost:8077}
    catalog-embedding-path: /api/v1/embeddings

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

melisa:
  ai:
    memory:
      max-messages: 14
      ttl-seconds: 2592000

    classifier:
      model: "claude-haiku-4-5"
      max-output-tokens: 64
      max-input-chars: 4000
      temperature: 0.0

    general:
      model: "claude-sonnet-4-5"
      max-output-tokens: 1024
      max-input-chars: 12000
      temperature: 0.3

    product:
      model: "claude-opus-4-5"
      max-output-tokens: 1024
      max-input-chars: 14000
      temperature: 0.2

    summary:
      model: "claude-haiku-4-5"
      max-output-tokens: 400
      max-input-chars: 8000
      temperature: 0.1

  models:
    difficulty-rate: 0.5
    router-model:
      base-url: https://rsfiaucrrl1yce-8005.proxy.runpod.net
      auth-key: dri6omaW89iswetraq1jich
      difficulty-path: /difficulty
      summarize-path: /summarize
      max-tokens: 512
    llama-model:
      base-url:
      auth-key: dri6omaW89iswetraq1jich
      chat-path: /v1/chat/completions
      model: "llama-3.1-8b-instruct"
      max-tokens: 3024
      temperature: 0.2
    translator-model:
      base-url: https://rsfiaucrrl1yce-8000.proxy.runpod.net
      auth-key: dri6omaW89iswetraq1jich
      translator-path: /translate
    fitrat-model:
      base-url: https://rsfiaucrrl1yce-8006.proxy.runpod.net
      auth-key: dri6omaW89iswetraq1jich
      normalize-path: /normalize
      transliterate-path: /transliterate
      tokenize-path: /tokenize
      detect-path: /detect
      healthz-path: /healthz
    voyage-embedding:
      base-url: https://api.voyageai.com/v1/embeddings
      secret-key: ${SECRET_KEY}
      model: voyage-multilingual-2
      input-query-type: query
      input-document-type: document


server:
  port: ${PORT}
  max-http-request-header-size: 64KB

spring:
  application:
    name: llm-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: INFO

# --- Service Discovery (Eureka) ---
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

application:
  downstream:
    hmacSecret: ${HMAC_SECRET}
  catalog:
    catalog-service-url: ${CATALOG_SERVICE_URL}
    catalog-embedding-path: /api/v1/embeddings

# --- Your own service-level settings (optional but useful) ---
melisa:
  ai:
    memory:
      max-messages: 14
      ttl-seconds: 2592000

    classifier:
      model: "claude-haiku-4-5"
      max-output-tokens: 64
      max-input-chars: 4000
      temperature: 0.0

    general:
      model: "claude-sonnet-4-5"
      max-output-tokens: 1024
      max-input-chars: 12000
      temperature: 0.3

    product:
      model: "claude-opus-4-5"
      max-output-tokens: 1024
      max-input-chars: 14000
      temperature: 0.2

    summary:
      model: "claude-haiku-4-5"
      max-output-tokens: 400
      max-input-chars: 8000
      temperature: 0.1

  models:
    difficulty-rate: 0.5
    router-model:
      base-url: ${ROUTER_MODEL_URL}
      auth-key: ${AUTH_KEY}
      difficulty-path: /difficulty
      summarize-path: /summarize
      max-tokens: 256
      food-intent-path: /food-intent
    llama-model:
      base-url: ${LLAMA_BASE_URL}
      auth-key: ${AUTH_KEY}
      chat-path: /v1/chat/completions
      model: "llama-3.1-8b-instruct"
      max-tokens: 3024
      temperature: 0.2
    translator-model:
      base-url: ${TRANSLATOR_MODEL_URL}
      auth-key: ${AUTH_KEY}
      translator-path: /translate
    fitrat-model:
      base-url: ${FITRAT_MODEL_URL}
      auth-key: ${AUTH_KEY}
      normalize-path: /normalize
      transliterate-path: /transliterate
      tokenize-path: /tokenize
      detect-path: /detect
      healthz-path: /healthz
    embedding:
      base-url: https://api.openai.com/v1/embeddings
      secret-key: ${OPENAI_API_KEY}
      model: text-embedding-3-small
      dimensions: 1024

